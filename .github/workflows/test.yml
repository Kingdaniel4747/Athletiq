# Verify pull requests and main before Docker images are consumed by users.
name: Tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # node:22-alpine in the root Dockerfile — CI must match production.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node --check api/server.js
      # The public quick start must work before a user creates any .env file.
      - run: docker compose config -q
      - run: cp .env.example .env && docker compose config -q
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # A broken import or bad JSX fails the build long before any test covers it.
      - run: npm run build
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      # check-locales compares packs; the strict source scan also catches a key missing
      # from every pack.
      - run: node scripts/check-source-strings.mjs --strict
        working-directory: frontend
      # The fatigue model must never read higher after a rest day than before it.
      # Property probe over ~108k comparisons; too slow for the unit suite, cheap here.
      - run: npm run test:fatigue-probe
        working-directory: frontend
      # Verifies the exact one-image artifact consumed by the public Compose file.
      - run: docker build --tag athletiq:test .
