services:
  athletiq:
    image: ghcr.io/kingdaniel4747/athletiq:latest
    container_name: athletiq
    init: true
    ports:
      - "${WEB_PORT:-8080}:3000"
    volumes:
      - ./.athletiq:/data
    environment:
      RP_ID: "${RP_ID:-auto}"
      ORIGIN: "${ORIGIN:-auto}"
      RP_NAME: "${RP_NAME:-AthletiQ}"
      ALLOW_GUEST: "${ALLOW_GUEST:-1}"
      INVITE_ONLY: "${INVITE_ONLY:-0}"
      ADMIN_UIDS: "${ADMIN_UIDS:-}"
      SESSION_DAYS: "${SESSION_DAYS:-90}"
      AUDIT_LOG: "${AUDIT_LOG:-1}"
      AUDIT_MAX: "${AUDIT_MAX:-5000}"
      AUDIT_DAYS: "${AUDIT_DAYS:-90}"
      AUDIT_IP: "${AUDIT_IP:-off}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
      FOOD_USER_AGENT: "${FOOD_USER_AGENT:-AthletiQ/1.0 (self-hosted)}"
      MEALIE_URL: "${MEALIE_URL:-}"
      MEALIE_API_TOKEN: "${MEALIE_API_TOKEN:-}"
      AI_API_URL: "${AI_API_URL:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
