# Standalone Athletiq deployment. This is the only file an operator needs:
#
#   docker compose up -d
#
# Ready-made amd64/arm64 images are pulled from GitHub Container Registry.
name: athletiq

services:
  # One-time: download the exercise images + GIFs into ./media (skipped if already there).
  # ~140 MB, from github.com/hasaneyldrm/exercises-dataset. That dataset is MIT for the
  # metadata and instruction text, but the images and GIFs are © Gym visual
  # (https://gymvisual.com/) and are used under the dataset's terms — openGym neither
  # redistributes nor relicenses them. See NOTICE.md.
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          echo "  Source:  github.com/hasaneyldrm/exercises-dataset"
          echo "  Metadata and instruction text: MIT."
          echo "  Images and animations: © Gym visual — https://gymvisual.com/"
          echo "  They are used under that dataset's terms, not openGym's AGPL, and are"
          echo "  downloaded from upstream — openGym does not redistribute them."
          echo "  Terms: https://gymvisual.com/content/3-terms-and-conditions-of-use"
          echo "  Reusing this media yourself, commercially or not, needs your own licence"
          echo "  from Gym visual. Details in NOTICE.md."
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  # Passkey auth + per-user data (Node, no framework). All variables have safe
  # defaults, so a first test needs no .env file. Compose automatically reads
  # an optional .env file when the operator wants to customise the instance.
  api:
    image: ghcr.io/kingdaniel4747/athletiq-api:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "${PORT:-3000}"
      DATA_DIR: /data
      RP_ID: "${RP_ID:-localhost}"
      ORIGIN: "${ORIGIN:-http://localhost:8080}"
      RP_NAME: "${RP_NAME:-Athletiq}"
      ADMIN_UIDS: "${ADMIN_UIDS:-}"
      INVITE_ONLY: "${INVITE_ONLY:-0}"
      ALLOW_GUEST: "${ALLOW_GUEST:-1}"
      SESSION_DAYS: "${SESSION_DAYS:-90}"
      AUDIT_LOG: "${AUDIT_LOG:-1}"
      AUDIT_MAX: "${AUDIT_MAX:-5000}"
      AUDIT_DAYS: "${AUDIT_DAYS:-90}"
      AUDIT_IP: "${AUDIT_IP:-off}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
      FOOD_USER_AGENT: "${FOOD_USER_AGENT:-Athletiq/1.0 (self-hosted)}"
      MEALIE_URL: "${MEALIE_URL:-}"
      MEALIE_API_TOKEN: "${MEALIE_API_TOKEN:-}"
      AI_API_URL: "${AI_API_URL:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
    extra_hosts:
      # Lets a locally hosted AI endpoint (for example Ollama) be reached from
      # the container on Docker Desktop and current Linux Docker versions.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data         # users, passkeys, per-user state, session secret — BACK THIS UP

  # Serves the prebuilt React frontend, proxies /api → api and mounts the
  # exercise media. Frontend and API share one origin for passkeys.
  web:
    image: ghcr.io/kingdaniel4747/athletiq-web:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:${NGINX_PORT:-80}"
    # nginx renders its config at start-up from these (web/nginx.conf.template),
    # so the API service does not have to be called `api`. Defaults are the old
    # hardcoded values, so an existing .env and an existing stack are unaffected.
    environment:
      NGINX_PORT: "${NGINX_PORT:-80}"
      BACKEND: "${BACKEND:-api}"
      PORT: "${PORT:-3000}"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
